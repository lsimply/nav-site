<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>精选导航</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* 基础重置：独立部署时由页面自己提供 */
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<style>
/* 布局：顶栏（品牌、搜索、主题），左侧分类栏，右侧是便当格头图（时钟、统计、联系）加卡片网格。手机上分类栏变成横向滑动。 */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --fg: #10141a;
  --muted: #5d6676;
  --faint: #8a93a3;
  --line: #e4e7ec;
  --line-strong: #cfd4dc;
  --accent: #3b57ee;
  --accent-fg: #ffffff;
  --accent-soft: #eceffe;
  --hot-fg: #b54708;
  --hot-bg: #fef0c7;
  --ic-bg-s: 85%; --ic-bg-l: 94%; --ic-fg-s: 60%; --ic-fg-l: 38%;
  --shadow-hover: 0 1px 2px rgba(16, 20, 26, .06), 0 12px 26px -14px rgba(16, 20, 26, .28);
  --font-body: "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --font-head: "Space Grotesk", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0e12; --surface: #14171c; --fg: #eceef2; --muted: #9099a8; --faint: #667082;
    --line: #22262d; --line-strong: #343a45; --accent: #8aa0ff; --accent-fg: #0b1030; --accent-soft: #1a2040;
    --hot-fg: #fdb022; --hot-bg: #3a2a0a;
    --ic-bg-s: 38%; --ic-bg-l: 19%; --ic-fg-s: 80%; --ic-fg-l: 74%;
    --shadow-hover: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 26px -14px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0e12; --surface: #14171c; --fg: #eceef2; --muted: #9099a8; --faint: #667082;
  --line: #22262d; --line-strong: #343a45; --accent: #8aa0ff; --accent-fg: #0b1030; --accent-soft: #1a2040;
  --hot-fg: #fdb022; --hot-bg: #3a2a0a;
  --ic-bg-s: 38%; --ic-bg-l: 19%; --ic-fg-s: 80%; --ic-fg-l: 74%;
  --shadow-hover: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 26px -14px rgba(0, 0, 0, .8);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6; padding-bottom: 56px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap {
  max-width: 1280px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

/* 顶栏 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; flex: none; font-family: var(--font-head); font-weight: 700; font-size: 17px; }
.mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; }
.mark svg { width: 18px; height: 18px; }
.search { position: relative; flex: 1; max-width: 620px; margin: 0 auto; }
.search input {
  width: 100%; height: 42px; font: inherit; font-size: 15px; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; padding: 0 48px 0 104px;
}
.search input::placeholder { color: var(--faint); }
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.eng { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); z-index: 1; }
.eng::after { content: "▾"; position: absolute; right: 9px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--accent); font-size: 11px; }
.eng select {
  appearance: none; -webkit-appearance: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--accent);
  background: var(--accent-soft); border: 0; border-radius: 8px; padding: 6px 24px 6px 12px; cursor: pointer;
}
.search kbd {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none;
  font: inherit; font-size: 12px; color: var(--faint); border: 1px solid var(--line-strong); border-radius: 6px; padding: 0 7px;
}
.theme {
  flex: none; font: inherit; font-size: 13px; color: var(--muted); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; cursor: pointer;
}
.theme:hover { color: var(--fg); border-color: var(--line-strong); }

/* 主体：左侧分类，右侧内容 */
.shell { display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 32px; align-items: start; padding-top: 22px; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); max-height: calc(100dvh - 100px); overflow-y: auto; scrollbar-width: thin; }
.gl { margin: 14px 0 6px 10px; font-size: 12px; color: var(--faint); letter-spacing: .08em; }
.gl:first-child { margin-top: 0; }
.nv {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font: inherit; font-size: 14px;
  color: var(--muted); background: none; border: 0; border-radius: 8px; padding: 7px 10px; cursor: pointer;
}
.nv:hover { background: var(--accent-soft); color: var(--fg); }
.nv[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nv .lb { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nv .n { margin-left: auto; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.dot { flex: none; width: 9px; height: 9px; border-radius: 3px; background: hsl(var(--h) 70% 56%); }
.star { flex: none; width: 9px; text-align: center; color: #f2a93b; font-size: 13px; line-height: 1; }

/* 便当格头图 */
.bento { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; min-width: 0; }
.tile h3 { margin: 0 0 10px; font-size: 12px; font-weight: 500; color: var(--faint); letter-spacing: .08em; }
.hello { margin: 0; color: var(--muted); font-size: 14px; }
.clock {
  margin: 2px 0 0; font-family: var(--font-head); font-weight: 600; line-height: 1.05;
  font-size: clamp(48px, 7vw, 68px); letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
}
.clock .colon { color: var(--accent); display: inline-block; margin: 0 .02em; animation: blink 2s steps(1) infinite; }
.clock .sec { font-size: .32em; letter-spacing: 0; color: var(--faint); margin-left: .25em; font-weight: 500; vertical-align: .5em; }
@keyframes blink { 50% { opacity: .3; } }
.stats { display: flex; gap: 28px; }
.stat b { display: block; font-family: var(--font-head); font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.upd { margin: 12px 0 0; font-size: 12.5px; color: var(--faint); }
.tile .links { display: flex; flex-direction: column; gap: 2px; }
.tile .links a {
  display: flex; align-items: center; gap: 10px; text-decoration: none; font-size: 14px; font-weight: 500;
  padding: 5px 8px; margin-inline: -8px; border-radius: 8px;
}
.tile .links a:hover { background: var(--accent-soft); color: var(--accent); }
.tile .links svg { width: 17px; height: 17px; flex: none; color: var(--accent); }
.tile .links small { color: var(--faint); font-size: 12px; font-weight: 400; margin-left: auto; }

/* 标签筛选 */
.filters { margin-top: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.flabel { color: var(--faint); font-size: 13px; margin-right: 2px; }
.chip {
  font: inherit; font-size: 13px; color: var(--muted); background: var(--surface); cursor: pointer;
  border: 1px solid var(--line); border-radius: 8px; padding: 3px 11px;
}
.chip:hover { color: var(--fg); border-color: var(--line-strong); }
.chip[aria-pressed="true"] { color: var(--accent-fg); background: var(--accent); border-color: transparent; }
.clear { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 2px 6px; }

/* 分类段落与卡片 */
main { margin-top: 24px; display: flex; flex-direction: column; gap: 38px; }
.sec h2 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0; font-family: var(--font-head); font-size: 17px; font-weight: 600; }
.sec h2 .cnt { font-size: 13px; font-weight: 400; color: var(--faint); font-variant-numeric: tabular-nums; }
.sec .note { margin: 4px 0 0; color: var(--muted); font-size: 14px; max-width: 60ch; }
.grid { margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(256px, 1fr)); gap: 12px; }
.cell { position: relative; display: flex; min-width: 0; }
.card {
  flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; text-decoration: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
  transition: border-color .15s, box-shadow .15s, transform .15s;
}
.cell:hover .card { border-color: var(--line-strong); box-shadow: var(--shadow-hover); transform: translateY(-2px); }
.head { display: flex; align-items: center; gap: 11px; min-width: 0; padding-right: 26px; }
.ic {
  flex: none; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
  background: hsl(var(--h) var(--ic-bg-s) var(--ic-bg-l)); color: hsl(var(--h) var(--ic-fg-s) var(--ic-fg-l));
}
.ic svg { width: 20px; height: 20px; display: block; }
.ic.has-img { background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.ic img { width: 100%; height: 100%; object-fit: contain; padding: 6px; display: block; }
.who { min-width: 0; display: flex; flex-direction: column; }
.name { font-weight: 600; font-size: 15px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.host { font-size: 12px; color: var(--faint); line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.desc {
  color: var(--muted); font-size: 13.5px; line-height: 1.6;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.tags { margin-top: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 11.5px; line-height: 1.7; color: var(--muted); background: var(--bg); border-radius: 6px; padding: 0 7px; }
.tag.new { color: var(--accent); background: var(--accent-soft); }
.tag.hot { color: var(--hot-fg); background: var(--hot-bg); }
.fav {
  position: absolute; top: 10px; right: 8px; width: 30px; height: 30px; display: grid; place-items: center;
  font-size: 17px; line-height: 1; color: var(--faint); background: transparent; border: 0; border-radius: 8px;
  cursor: pointer; opacity: .6; transition: opacity .15s, color .15s;
}
.cell:hover .fav, .fav:focus-visible, .fav[aria-pressed="true"] { opacity: 1; }
.fav:hover, .fav[aria-pressed="true"] { color: #f2a93b; }
.more {
  display: block; margin: 14px auto 0; font: inherit; font-size: 14px; color: var(--accent); background: var(--accent-soft);
  border: 0; border-radius: 10px; padding: 8px 22px; cursor: pointer;
}
.more:hover { filter: brightness(1.05); }

.empty { text-align: center; color: var(--muted); padding: 56px 0; }
.empty p { margin: 0 0 14px; }
.empty .links { display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.empty .links a { color: var(--accent); border: 1px solid var(--line-strong); border-radius: 10px; padding: 5px 16px; text-decoration: none; background: var(--surface); }
.empty .links a:hover { border-color: var(--accent); }

footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--faint); font-size: 13px; }

/* 懒渲染：屏幕外的分类段落先不绘制，滚到附近再绘制 */
.sec { content-visibility: auto; contain-intrinsic-size: auto 520px; }
/* 数据到达时卡片依次淡入（只在首次渲染和同步出现变化时播放，搜索和筛选时不播放） */
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#list.enter .cell { animation: rise .38s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 30ms); }
/* 骨架屏：只有在线表格、又没有任何本地数据或缓存时才会出现 */
@keyframes shimmer { to { background-position: -200% 0; } }
.skel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(256px, 1fr)); gap: 12px; }
.skel {
  height: 118px; border-radius: 12px; border: 1px solid var(--line);
  background: linear-gradient(100deg, var(--surface) 30%, var(--accent-soft) 50%, var(--surface) 70%) 100% 0 / 200% 100%;
  animation: shimmer 1.4s linear infinite;
}
.skel-title { width: 120px; height: 18px; border-radius: 6px; margin-bottom: 14px; }
/* 同步状态小圆点 */
@keyframes pulse { from { opacity: .25; } to { opacity: 1; } }
.sync-on::before {
  content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
  margin-right: 7px; vertical-align: 1px; animation: pulse .9s ease-in-out infinite alternate;
}
@media (max-width: 1020px) {
  .bento { grid-template-columns: 1fr 1fr; }
  .clock-tile { grid-column: 1 / -1; }
}
@media (max-width: 880px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-top: 16px; }
  .side { position: static; max-height: none; overflow: visible; }
  #side { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
  .gl { display: none; }
  .nv { flex: none; width: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; }
  .nv[aria-pressed="true"] { border-color: transparent; }
}
@media (max-width: 720px) {
  .top { position: static; }
  .bar { flex-wrap: wrap; row-gap: 10px; }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .search kbd { display: none; }
}
@media (max-width: 440px) {
  .bento { grid-template-columns: 1fr; }
  .stats-tile { display: none; }
  .clock { font-size: 52px; }
  .grid { grid-template-columns: 1fr; }
  /* 手机上头部尽量紧凑，让站点更早出现在首屏 */
  .tile { padding: 14px 16px; }
  .tile h3 { display: none; }
  .tile .links { flex-direction: row; flex-wrap: wrap; gap: 8px; }
  .tile .links a { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; margin: 0; }
  .tile .links small { display: none; }
}
@media (max-width: 720px) {
  .filters { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .filters .chip, .filters .flabel, .filters .clear { flex: none; white-space: nowrap; }
}
@media (prefers-reduced-motion: reduce) {
  .clock .colon { animation: none; }
  .card, .fav { transition: none; }
  .cell:hover .card { transform: none; }
  #list.enter .cell, .skel, .sync-on::before { animation: none; }
}
</style>

</head>
<body>
<header class="top">
  <div class="bar wrap">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2.1 6.3-6.3 2.1 2.1-6.3z"/></svg></span>
      精选导航
    </div>
    <div class="search">
      <label class="eng"><select id="engine" aria-label="搜索范围"></select></label>
      <input id="q" type="search" placeholder="搜索名称、用途或标签" autocomplete="off" aria-label="搜索">
      <kbd>/</kbd>
    </div>
    <button class="theme" id="theme" type="button" aria-label="切换主题">深色</button>
  </div>
</header>

<div class="shell wrap">
  <aside class="side"><nav id="side" aria-label="分类"></nav></aside>

  <div class="content">
    <section class="bento" aria-label="概览">
      <div class="tile clock-tile">
        <p class="hello" id="hello"></p>
        <p class="clock" id="clock" aria-live="off"></p>
      </div>
      <div class="tile stats-tile">
        <h3>收录</h3>
        <div class="stats">
          <div class="stat"><b id="st-sites">0</b><span>个站点</span></div>
          <div class="stat"><b id="st-cats">0</b><span>个分类</span></div>
        </div>
        <p class="upd" id="st-date"></p>
      </div>
      <div class="tile">
        <h3>联系我</h3>
        <div class="links">
          <a href="https://x.com/audawang" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 4l16 16"/><path d="M20 4 4 20"/></svg>X <small>@audawang</small></a>
          <a href="https://t.me/dw666bot" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>Telegram <small>dw666bot</small></a>
          <a href="https://youtube.com/@ieasyme" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><path d="m10 15 5-3-5-3z"/></svg>YouTube <small>@ieasyme</small></a>
        </div>
      </div>
    </section>

    <div class="filters" id="filters"></div>
    <main id="list"></main>

    <footer>部分站点数据整理自。免费额度、登录要求和网络条件以站点实际页面为准。</footer>
  </div>
</div>

<script src="sites.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hue = (s) => { let h = 0; for (const ch of s) h = (h * 31 + ch.codePointAt(0)) % 360; return h; };
const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (_) { return u; } };

/* 站点数据在同目录的 sites.js 里（由上面的 script 标签加载），增删站点只改那个文件 */
let SITES = window.SITES_DATA || { updated: "", categories: [], items: [] };


const catHue = (id) => { const i = SITES.categories.findIndex((c) => c.id === id); return (i * 47 + 205) % 360; };
/* 同一分类的图标色相相近，单个站点再略微错开 */
const itemHue = (i) => (catHue(i.c) + (hue(i.name) % 21) - 10 + 360) % 360;

/* 线性图标（24x24，描边风格），键名对应各站点的 icon 字段；没写或写错时用链接图标 */
const ICONS = {
  link: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
  compress: '<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/>',
  pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',

const svgIcon = (body) =>
  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
/* icon 可以是内置图标名，也可以是图片地址（https:// 开头、data:image、相对路径，或以 .png/.svg/.jpg/.webp/.ico 结尾） */
const isImg = (v) => typeof v === "string" && /^(https?:)?\/\/|^data:image\/|^\.{0,2}\/|\.(png|svg|jpe?g|webp|gif|ico)(\?.*)?$/i.test(v);
const icon = (i) => isImg(i.icon)
  ? `<img class="ic-img" src="${esc(i.icon)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">`
  : svgIcon(ICONS[i.icon] || ICONS.link);
/* 图片加载失败时，退回默认的链接图标 */
document.addEventListener("error", (e) => {
  const t = e.target;
  if (t && t.tagName === "IMG" && t.classList.contains("ic-img")) {
    t.parentElement.classList.remove("has-img");
    t.outerHTML = svgIcon(ICONS.link);
  }
}, true);

/* ===== 状态 ===== */
let cat = "all";
let query = "";
const activeTags = new Set();
const expanded = new Set();

/* 收藏：存在访问者自己的浏览器里，用网址做标识 */
let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem("nav-favs") || "[]")); } catch (_) {}
const saveFavs = () => { try { localStorage.setItem("nav-favs", JSON.stringify([...favs])); } catch (_) {} };
const favItems = () => SITES.items.filter((i) => favs.has(i.url));

/* ===== 时钟：用访问者本机时间 ===== */
function tick() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  const h = d.getHours();
  const greet = h < 5 ? "夜深了" : h < 11 ? "早上好" : h < 13 ? "中午好" : h < 18 ? "下午好" : "晚上好";
  const date = d.toLocaleDateString("zh-CN", { month: "long", day: "numeric", weekday: "long" });
  $("#hello").textContent = `${greet} · ${date}`;
  $("#clock").innerHTML = `${p(h)}<span class="colon">:</span>${p(d.getMinutes())}<span class="sec">${p(d.getSeconds())}</span>`;
}

/* ===== 渲染 ===== */
function card(i, n) {
  const on = favs.has(i.url);
  const tags = (i.tags || []).slice(0, 4)
    .map((t) => `<span class="tag${t === "新增" ? " new" : t === "热门" ? " hot" : ""}">${esc(t)}</span>`).join("");
  return `<div class="cell" style="--i:${Math.min(n || 0, 14)}"><a class="card" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">
    <span class="head">
      <span class="ic${isImg(i.icon) ? " has-img" : ""}" style="--h:${itemHue(i)}">${icon(i)}</span>
      <span class="who"><span class="name">${esc(i.name)}</span><span class="host">${esc(host(i.url))}</span></span>
    </span>
    ${i.desc ? `<span class="desc">${esc(i.desc)}</span>` : ""}
    ${tags ? `<span class="tags">${tags}</span>` : ""}
  </a>
  <button class="fav" type="button" data-url="${esc(i.url)}" aria-pressed="${on}" aria-label="${on ? "取消收藏" : "收藏"} ${esc(i.name)}" title="${on ? "取消收藏" : "收藏"}">${on ? "★" : "☆"}</button></div>`;
}

function section(title, h, note, items, total, moreId) {
  return `<section class="sec">
    <h2><i class="dot" style="--h:${h}"></i>${esc(title)}<span class="cnt">${total} 个</span></h2>
    ${note ? `<p class="note">${esc(note)}</p>` : ""}
    <div class="grid">${items.map(card).join("")}</div>
    ${moreId ? `<button class="more" type="button" data-more="${esc(moreId)}">展开全部 ${total} 个</button>` : ""}
  </section>`;
}

function renderSide() {
  const nv = (id, label, n, mark) =>
    `<button class="nv" type="button" data-id="${esc(id)}" aria-pressed="${cat === id}">${mark}<span class="lb">${esc(label)}</span><span class="n">${n}</span></button>`;
  $("#side").innerHTML =
    `<p class="gl">浏览</p>` +
    nv("all", "全部", SITES.items.length, `<i class="dot" style="--h:220"></i>`) +
    nv("fav", "我的收藏", favItems().length, `<span class="star">★</span>`) +
    `<p class="gl">分类</p>` +
    SITES.categories.map((c) => nv(c.id, c.name, SITES.items.filter((i) => i.c === c.id).length, `<i class="dot" style="--h:${catHue(c.id)}"></i>`)).join("");
}

/* 标签筛选：出现 2 次以上的标签才显示，可多选（需同时满足） */
function renderFilters() {
  const count = {};
  SITES.items.forEach((i) => (i.tags || []).forEach((t) => { count[t] = (count[t] || 0) + 1; }));
  const tags = Object.entries(count).filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]).map(([t]) => t);
  $("#filters").hidden = !tags.length;
  $("#filters").innerHTML =
    `<span class="flabel">筛选</span>` +
    tags.map((t) => `<button class="chip" type="button" data-tag="${esc(t)}" aria-pressed="${activeTags.has(t)}">${esc(t)}</button>`).join("") +
    (activeTags.size ? `<button class="clear" type="button" data-clear-tags>清除</button>` : "");
}

function matches(item, q) {
  const hay = [item.name, item.desc || "", item.url, ...(item.tags || [])].join(" ").toLowerCase();
  return q.split(/\s+/).filter(Boolean).every((w) => hay.includes(w));
}

function featured() {
  const hot = SITES.items.filter((i) => (i.tags || []).includes("热门"));
  const pins = SITES.items.filter((i) => i.pin && !hot.includes(i));
  const pick = (hot.length >= 6 ? hot : [...hot, ...pins]).slice(0, 9);
  return pick.length ? section("热门推荐", 38, "", pick, pick.length, "") : "";
}

function renderList() {
  const q = query.trim().toLowerCase();
  let pool = SITES.items.filter((i) => (q ? matches(i, q) : cat === "all" || cat === "fav" || i.c === cat));
  if (cat === "fav" && !q) pool = pool.filter((i) => favs.has(i.url));
  if (activeTags.size) pool = pool.filter((i) => [...activeTags].every((t) => (i.tags || []).includes(t)));

  if (!pool.length) {
    if (q) {
      const e = encodeURIComponent(query.trim());
      $("#list").innerHTML = `<div class="empty"><p>站内没有找到「${esc(query.trim())}」。</p>
        <div class="links">
          <a href="https://www.bing.com/search?q=${e}" target="_blank" rel="noopener noreferrer">用 Bing 搜索</a>
          <a href="https://www.baidu.com/s?wd=${e}" target="_blank" rel="noopener noreferrer">用百度搜索</a>
          <a href="https://www.google.com/search?q=${e}" target="_blank" rel="noopener noreferrer">用 Google 搜索</a>
        </div></div>`;
    } else if (cat === "fav" && !activeTags.size) {
      $("#list").innerHTML = `<div class="empty"><p>还没有收藏。点任意卡片右上角的星标，就会出现在这里。</p></div>`;
    } else {
      $("#list").innerHTML = `<div class="empty"><p>没有同时满足这些标签的站点。</p><div class="links"><a href="#" data-clear-tags>清除筛选</a></div></div>`;
    }
    return;
  }

  if (cat === "fav" && !q) {
    $("#list").innerHTML = section("我的收藏", 45, "", pool, pool.length, "");
    return;
  }

  const home = cat === "all" && !q && !activeTags.size;
  const parts = [];
  if (home) {
    const f = favItems();
    if (f.length) parts.push(section("我的收藏", 45, "", f, f.length, ""));
    parts.push(featured());
  }
  SITES.categories.forEach((c) => {
    const items = pool.filter((i) => i.c === c.id);
    if (!items.length) return;
    /* 首页每个分类先显示 12 个，点按钮展开；进入具体分类或搜索时显示全部 */
    const limit = home && !expanded.has(c.id) ? 12 : Infinity;
    const shown = items.slice(0, limit);
    parts.push(section(c.name, catHue(c.id), c.note, shown, items.length, shown.length < items.length ? c.id : ""));
  });
  $("#list").innerHTML = parts.join("");
}

function render() { renderSide(); renderFilters(); renderList(); }

/* ===== 交互 ===== */
$("#side").addEventListener("click", (e) => {
  const b = e.target.closest(".nv");
  if (!b) return;
  cat = b.dataset.id;
  query = ""; $("#q").value = "";
  try { history.replaceState(null, "", cat === "all" ? location.pathname + location.search : "#" + cat); } catch (_) {}
  render();
  window.scrollTo(0, 0);
});

$("#filters").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (e.target.closest("[data-clear-tags]")) activeTags.clear();
  else if (chip) { const t = chip.dataset.tag; activeTags.has(t) ? activeTags.delete(t) : activeTags.add(t); }
  else return;
  render();
});

$("#list").addEventListener("click", (e) => {
  const m = e.target.closest("[data-more]");
  if (m) { expanded.add(m.dataset.more); renderList(); return; }
  const f = e.target.closest(".fav");
  if (f) {
    const u = f.dataset.url;
    favs.has(u) ? favs.delete(u) : favs.add(u);
    saveFavs(); renderSide(); renderList();
    const again = [...document.querySelectorAll(".fav")].find((b) => b.dataset.url === u);
    if (again) again.focus();
    return;
  }
  if (e.target.closest("[data-clear-tags]")) { e.preventDefault(); activeTags.clear(); render(); }
});

$("#q").addEventListener("input", (e) => { query = e.target.value; renderList(); });
$("#q").addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.target.value = ""; query = ""; renderList(); e.target.blur(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("#q") && !e.metaKey && !e.ctrlKey) {
    e.preventDefault(); $("#q").focus();
  }
});

/* 搜索范围：默认只在站内筛选；选了搜索引擎后仍会实时筛选，按回车再用该引擎搜索 */
const ENGINES = {
  site:   { name: "站内" },
  bing:   { name: "Bing",   url: "https://www.bing.com/search?q=" },
  baidu:  { name: "百度",   url: "https://www.baidu.com/s?wd=" },
  google: { name: "Google", url: "https://www.google.com/search?q=" }
};
let engine = "site";
try { const e = localStorage.getItem("nav-engine"); if (ENGINES[e]) engine = e; } catch (_) {}
$("#engine").innerHTML = Object.entries(ENGINES).map(([k, v]) => `<option value="${k}">${esc(v.name)}</option>`).join("");
function syncEngine() {
  $("#engine").value = engine;
  $("#q").placeholder = engine === "site" ? "搜索名称、用途或标签" : `站内实时筛选，回车用 ${ENGINES[engine].name} 搜索`;
}
$("#engine").addEventListener("change", (e) => {
  engine = e.target.value;
  try { localStorage.setItem("nav-engine", engine); } catch (_) {}
  syncEngine();
});
$("#q").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || engine === "site" || !query.trim() || e.isComposing) return;
  const a = document.createElement("a");
  a.href = ENGINES[engine].url + encodeURIComponent(query.trim());
  a.target = "_blank"; a.rel = "noopener noreferrer";
  a.click();
});

function fromHash() {
  const id = location.hash.slice(1);
  cat = id === "fav" || SITES.categories.some((c) => c.id === id) ? id : "all";
  render();
}
window.addEventListener("hashchange", fromHash);

/* 主题切换：默认跟随系统，手动选择后记在本机浏览器里 */
const root = document.documentElement;
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
function syncThemeBtn() { $("#theme").textContent = isDark() ? "浅色" : "深色"; }
try { const t = localStorage.getItem("nav-theme"); if (t) root.dataset.theme = t; } catch (_) {}
$("#theme").addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  root.dataset.theme = next;
  try { localStorage.setItem("nav-theme", next); } catch (_) {}
  syncThemeBtn();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncThemeBtn);

/* ===== 启动 ===== */
function boot() {
  $("#st-sites").textContent = SITES.items.length;
  $("#st-cats").textContent = SITES.categories.length;
  $("#st-date").textContent = SITES.updated ? "更新于 " + SITES.updated : "";
  fromHash();
}
syncThemeBtn();
syncEngine();
tick();
setInterval(tick, 1000);
/* ===== 在线表格：sites.js 顶部设置了 SHEET_URL 时，读取表格的 CSV 替换本地数据；读取失败则继续用本地数据 ===== */
function parseCSV(t) {
  t = t.replace(/^﻿/, "");
  const rows = []; let row = [], cell = "", inQ = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (inQ) {
      if (c === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else inQ = false; }
      else cell += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && t[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((x) => x.trim() !== ""));
}
function sheetToSites(input) {
  const rows = typeof input === "string" ? parseCSV(input) : input;
  if (rows.length < 2) throw new Error("empty");
  const names = {
    c: ["分类", "category", "cat"], name: ["站点", "名称", "name"], url: ["网址", "链接", "url"],
    icon: ["图标", "icon"], desc: ["简介", "说明", "desc", "description"], tags: ["标签", "tags"],
    pin: ["置顶", "pin"], note: ["分类说明", "note"]
  };
  const head = rows[0].map((h) => h.trim().toLowerCase());
  const col = {};
  for (const k in names) col[k] = head.findIndex((h) => names[k].includes(h));
  if (col.c < 0 || col.name < 0 || col.url < 0) throw new Error("columns");
  const get = (r, k) => (col[k] >= 0 ? (r[col[k]] || "").trim() : "");
  const cats = [], idOf = {}, items = [];
  for (const r of rows.slice(1)) {
    const name = get(r, "name"), url = get(r, "url"), cn = get(r, "c");
    if (!name || !/^https?:\/\//i.test(url) || !cn) continue;
    if (!(cn in idOf)) { idOf[cn] = "s" + cats.length; cats.push({ id: idOf[cn], name: cn, note: "" }); }
    const cat = cats[Number(idOf[cn].slice(1))];
    if (!cat.note) cat.note = get(r, "note");
    const it = { c: idOf[cn], name, url };
    if (get(r, "icon")) it.icon = get(r, "icon");
    if (get(r, "desc")) it.desc = get(r, "desc");
    const tags = get(r, "tags").split(/[|,，、;；]/).map((x) => x.trim()).filter(Boolean);
    if (tags.length) it.tags = tags;
    if (/^(1|true|yes|y|是|√|✓)$/i.test(get(r, "pin"))) it.pin = true;
    items.push(it);
  }
  if (!items.length) throw new Error("no items");
  return { updated: "", categories: cats, items };
}
/* 链接可以直接粘贴 Google 表格的分享链接（需设为“知道链接的任何人可查看”），也可以是“发布到网络”的 CSV 链接 */
function sheetCsvUrl(u) {
  const m = u.match(/docs\.google\.com\/spreadsheets\/d\/([\w-]+)/);
  if (!m || m[1] === "e" || /output=csv|tqx=out:csv/.test(u)) return u;
  const gid = (u.match(/[#&?]gid=(\d+)/) || [])[1];
  return `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv&headers=1${gid ? "&gid=" + gid : ""}`;
}
/* 备用读取方式：用 script 标签加载 Google 表格的数据接口，不受跨域限制（表格需设为“知道链接的任何人可查看”） */
function sheetViaScript(u) {
  return new Promise((resolve, reject) => {
    const m = u.match(/docs\.google\.com\/spreadsheets\/d\/([\w-]+)/);
    if (!m || m[1] === "e") return reject(new Error("not a google sheet"));
    const gid = (u.match(/[#&?]gid=(\d+)/) || [])[1];
    const cb = "__sheetCb" + Date.now();
    const s = document.createElement("script");
    const done = () => { delete window[cb]; s.remove(); };
    window[cb] = (res) => {
      done();
      try {
        const t = res.table;
        const labels = t.cols.map((c) => c.label || "");
        const body = t.rows.map((r) => (r.c || []).map((c) => (c && c.v != null ? String(c.v) : "")));
        resolve(labels.some(Boolean) ? [labels, ...body] : body);
      } catch (e) { reject(e); }
    };
    s.onerror = () => { done(); reject(new Error("script")); };
    s.src = `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=responseHandler:${cb}&headers=1${gid ? "&gid=" + gid : ""}`;
    document.head.appendChild(s);
    setTimeout(() => { if (window[cb]) { done(); reject(new Error("timeout")); } }, 10000);
  });
}
/* 读取策略：先立刻显示缓存或本地数据，后台同步在线表格；读到后只有内容真的变了才更新，并淡入。
   在线表格读不到（比如大陆访问不了 Google）时，页面不受影响，继续显示已有数据。 */
function fetchCsv(u) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 8000);
  return fetch(sheetCsvUrl(u), { cache: "no-cache", signal: ctl.signal })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(sheetToSites)
    .finally(() => clearTimeout(timer));
}
function readCache() {
  try {
    const c = JSON.parse(localStorage.getItem("nav-cache") || "null");
    if (c && c.u === window.SHEET_URL && c.d && c.d.items && c.d.items.length) return c.d;
  } catch (_) {}
  return null;
}
function writeCache(d) { try { localStorage.setItem("nav-cache", JSON.stringify({ u: window.SHEET_URL, d })); } catch (_) {} }
function setSync(state) {
  const el = $("#st-date");
  el.classList.toggle("sync-on", state === "loading");
  if (state === "loading") el.textContent = "正在同步最新数据…";
  else if (state === "ok") el.textContent = "已同步最新数据";
  else if (state === "fail") el.textContent = "最新数据暂时读不到，显示已保存的内容";
}
/* 播放一次卡片淡入 */
let enterTimer;
function playEnter() {
  const el = $("#list");
  el.classList.remove("enter");
  void el.offsetWidth;
  el.classList.add("enter");
  clearTimeout(enterTimer);
  enterTimer = setTimeout(() => el.classList.remove("enter"), 1200);
}
function skeleton() {
  const cards = Array.from({ length: 9 }, () => '<div class="skel"></div>').join("");
  return `<div aria-busy="true" aria-label="正在加载"><div class="skel skel-title"></div><div class="skel-grid">${cards}</div></div>`;
}
function loadSheet() {
  const u = window.SHEET_URL;
  setSync("loading");
  /* 普通请求和 script 方式同时发出，谁先成功用谁，另一个失败不影响 */
  Promise.any([fetchCsv(u), sheetViaScript(u).then(sheetToSites)])
    .then((d) => {
      const changed = JSON.stringify(d) !== JSON.stringify(SITES);
      writeCache(d);
      if (changed) { SITES = d; boot(); playEnter(); }
      setSync("ok");
    })
    .catch(() => {
      if (SITES.items.length) setSync("fail");
      else $("#list").innerHTML = '<div class="empty"><p>在线表格没有读取成功，请确认已“发布到网络”为 CSV，并且链接填写正确。</p></div>';
    });
}

if (window.SHEET_URL) { const cached = readCache(); if (cached) SITES = cached; }
if (SITES.items.length) { boot(); playEnter(); }
else if (window.SHEET_URL) $("#list").innerHTML = skeleton();
else $("#list").innerHTML = '<div class="empty"><p>站点数据 sites.js 没有加载成功。请确认它和本页放在同一个目录，并且格式正确。</p></div>';
if (window.SHEET_URL) {
  /* 等页面本身加载完再去同步表格，读取慢或被拦截时不会拖住页面的加载状态 */
  if (document.readyState === "complete") loadSheet();
  else window.addEventListener("load", () => setTimeout(loadSheet, 0));
}
</script>
</body>
